name: Deploy to Render

on:
  push:
    branches: [main]

jobs:
  # ── Step 1: Quality Checks (Catch errors before triggering cloud deploy) ───
  validate:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate API TypeScript
        working-directory: apps/api
        run: |
          npm ci
          npx tsc --noEmit

      - name: Validate Web TypeScript
        working-directory: apps/web
        run: |
          npm ci
          npx tsc --noEmit

  # ── Step 2: Trigger Render Deploy ──────────────────────────────────────────
  deploy:
    name: Trigger Render Deployment
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Notify Render to Deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL is not set. Render will use automatic git-push tracking."
            exit 0
          fi
          echo "Pinging Render Deploy Hook..."
          curl -f -X POST "$RENDER_DEPLOY_HOOK_URL"
          echo "Render deployment triggered successfully!"
