name: Deploy to AWS EC2

# Triggers on every push to main branch only
on:
  push:
    branches: [main]

# ── Environment shared across all jobs ───────────────────────────────────────
env:
  AWS_REGION:       us-east-1
  ECR_REGISTRY:     ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
  API_REPO:         scholarship-api
  WEB_REPO:         scholarship-web
  ML_REPO:          scholarship-ml

# ─────────────────────────────────────────────────────────────────────────────
jobs:

  # ── Job 1: Build & push all three Docker images to ECR ───────────────────
  build-and-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.TAG }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # Generates a short 8-char commit SHA used as image tag
      - name: Set image tag
        id: tag
        run: echo "TAG=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # BuildKit layer caching cuts rebuild time from ~5min to ~30s on unchanged layers
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.API_REPO }}:${{ steps.tag.outputs.TAG }}
            ${{ env.ECR_REGISTRY }}/${{ env.API_REPO }}:latest

      - name: Build & push Web image
        uses: docker/build-push-action@v5
        with:
          context: apps/web
          file: apps/web/Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.WEB_REPO }}:${{ steps.tag.outputs.TAG }}
            ${{ env.ECR_REGISTRY }}/${{ env.WEB_REPO }}:latest

      - name: Build & push ML Service image
        uses: docker/build-push-action@v5
        with:
          context: ml-service
          file: ml-service/Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ML_REPO }}:${{ steps.tag.outputs.TAG }}
            ${{ env.ECR_REGISTRY }}/${{ env.ML_REPO }}:latest

  # ── Job 2: Deploy to EC2 via SSM (no SSH keys needed) ────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push          # Only runs after images are pushed
    environment: production        # Requires manual approval if configured

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      # Finds a healthy instance in the Auto Scaling Group automatically
      # No need to hard-code an instance ID
      - name: Resolve EC2 instance from ASG
        id: get-instance
        run: |
          INSTANCE_ID=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "${{ secrets.ASG_NAME }}" \
            --query "AutoScalingGroups[0].Instances[?HealthStatus=='Healthy'] | [0].InstanceId" \
            --output text)

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "ERROR: No healthy instance found in ASG ${{ secrets.ASG_NAME }}"
            exit 1
          fi

          echo "Deploying to EC2 instance: $INSTANCE_ID"
          echo "INSTANCE_ID=$INSTANCE_ID" >> $GITHUB_OUTPUT

      # SSM Run Command sends commands directly to the instance.
      # No bastion host, no SSH keys — uses IAM role attached to the EC2 instance.
      - name: Send deploy command via SSM
        id: ssm
        run: |
          TAG="${{ needs.build-and-push.outputs.image_tag }}"
          REGISTRY="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
          INSTANCE_ID="${{ steps.get-instance.outputs.INSTANCE_ID }}"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy $TAG" \
            --parameters commands="[
              \"#!/bin/bash\",
              \"set -euo pipefail\",
              \"export HOME=/home/ubuntu\",
              \"cd /home/ubuntu/app\",
              \"echo === Pull latest code ===\",
              \"sudo -u ubuntu git fetch origin main\",
              \"sudo -u ubuntu git reset --hard origin/main\",
              \"echo === Login to ECR ===\",
              \"aws ecr get-login-password --region ${{ env.AWS_REGION }} | sudo -u ubuntu docker login --username AWS --password-stdin $REGISTRY\",
              \"echo === Pull new images ===\",
              \"sudo -u ubuntu docker compose pull web api ml-service\",
              \"echo === Rolling restart (zero downtime for db/redis/minio) ===\",
              \"sudo -u ubuntu docker compose up -d --no-deps --no-build web api ml-service\",
              \"sleep 15\",
              \"echo === Run DB migrations ===\",
              \"sudo -u ubuntu docker compose exec -T api npx prisma db push --accept-data-loss 2>&1 || true\",
              \"echo === Seed data if first deploy ===\",
              \"sudo -u ubuntu docker compose exec -T api sh -c 'node dist/scripts/seed*.js 2>&1 || true'\",
              \"echo === Prune old images ===\",
              \"docker image prune -f\",
              \"echo === Container status ===\",
              \"sudo -u ubuntu docker compose ps\",
              \"echo === Deploy $TAG complete ===\"
            ]" \
            --timeout-seconds 600 \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"
          echo "COMMAND_ID=$COMMAND_ID" >> $GITHUB_OUTPUT

      # Polls SSM every 15 s up to 10 minutes, prints full output on success or failure
      - name: Wait for deploy to complete
        run: |
          INSTANCE_ID="${{ steps.get-instance.outputs.INSTANCE_ID }}"
          COMMAND_ID="${{ steps.ssm.outputs.COMMAND_ID }}"

          echo "Polling SSM command $COMMAND_ID on $INSTANCE_ID ..."

          for i in $(seq 1 40); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "Attempt $i/40 — Status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "=== Deploy output ==="
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "StandardOutputContent" \
                --output text
              echo "Deploy succeeded!"
              exit 0
            fi

            if [[ "$STATUS" =~ ^(Failed|Cancelled|TimedOut)$ ]]; then
              echo "=== STDOUT ==="
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "StandardOutputContent" --output text
              echo "=== STDERR ==="
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "StandardErrorContent" --output text
              echo "ERROR: Deploy failed with status: $STATUS"
              exit 1
            fi

            sleep 15
          done

          echo "ERROR: Timed out waiting for deploy (10 minutes)"
          exit 1

      # Posts a deployment summary to the GitHub deployment status
      - name: Notify deploy success
        if: success()
        run: |
          echo "### Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Image Tag | ${{ needs.build-and-push.outputs.image_tag }} |" >> $GITHUB_STEP_SUMMARY
          echo "| EC2 Instance | ${{ steps.get-instance.outputs.INSTANCE_ID }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Region | ${{ env.AWS_REGION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered by | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
