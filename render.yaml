services:
  # ── Web Frontend (Next.js 14) ──────────────────────────────────────────────
  - type: web
    name: scholarship-web
    runtime: docker
    dockerContext: apps/web
    dockerfilePath: apps/web/Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_INTERNAL_URL
        value: http://scholarship-api:4000
      - key: NEXT_PUBLIC_API_URL
        value: ""

  # ── Backend API (Express + Prisma + BullMQ) ────────────────────────────────
  - type: web
    name: scholarship-api
    runtime: docker
    dockerContext: .
    dockerfilePath: apps/api/Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: scholarship-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: scholarship-redis
          property: connectionString
      - key: ML_SERVICE_URL
        value: http://scholarship-ml:5000
      - key: JWT_SECRET
        generateValue: true
      - key: ML_ANOMALY_THRESHOLD
        value: "0.65"
      - key: APP_URL
        sync: false
      - key: MINIO_ENDPOINT
        value: play.min.io
      - key: MINIO_PORT
        value: 9000
      - key: MINIO_ACCESS_KEY
        sync: false
      - key: MINIO_SECRET_KEY
        sync: false
      - key: MINIO_BUCKET
        value: scholarship-docs
      - key: MINIO_USE_SSL
        value: "true"

  # ── ML Service (Python + FastAPI) ──────────────────────────────────────────
  - type: web
    name: scholarship-ml
    runtime: docker
    dockerContext: ml-service
    dockerfilePath: ml-service/Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 5000

  # ── Managed Key-Value / Redis (Valkey) ─────────────────────────────────────
  - type: keyvalue
    name: scholarship-redis
    plan: free
    region: oregon
    maxmemoryPolicy: noeviction
    ipAllowList: []

# ── Managed PostgreSQL Database ──────────────────────────────────────────────
databases:
  - name: scholarship-db
    plan: free
    region: oregon
    databaseName: scholarship_db
    user: scholarship
